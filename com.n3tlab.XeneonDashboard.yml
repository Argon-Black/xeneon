# Manifest Flatpak/Flathub pour Xeneon Dashboard.
#
# Chaque permission ci-dessous est justifiée par un usage précis du code
# (voir le commentaire en regard) - rien n'est ajouté "au cas où". C'est
# volontaire : Flathub review scrute en particulier --filesystem=host,
# --socket=session-bus (accès total au bus au lieu de noms précis) et
# --talk-name=org.freedesktop.Flatpak (flatpak-spawn --host, équivalent à
# sortir du sandbox) - les trois sont désactivés/évités ici par défaut.
#
# app-id : suppose que le domaine n3tlab.com (ou un sous-domaine) est
# vérifiable pour Flathub (fichier .well-known ou TXT DNS - voir la doc
# Flathub "App ID requirements"). Si ce domaine n'est pas à toi, il faudra
# soit le remplacer par un id io.github.<utilisateur>.XeneonDashboard, soit
# vérifier la propriété du domaine - Flathub refuse un app-id dont le
# domaine inversé n'est pas prouvé.
app-id: com.n3tlab.XeneonDashboard

# GNOME 47 au moment où ce manifest est écrit - à réajuster à la version
# stable courante avant soumission (flatpak remote-info flathub
# org.gnome.Platform pour voir ce qui est dispo). PyGObject/pycairo sont
# normalement déjà fournis par ce runtime : vérifier avec
#   flatpak run --command=python3 org.gnome.Platform//47 -c "import gi, cairo"
# avant d'ajouter un module pip pour l'un ou l'autre - sinon on duplique une
# dépendance déjà présente pour rien.
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: xeneon-dashboard

finish-args:
  # --- Affichage ---
  - --socket=wayland
  # Se réplie sur X11 seulement si le compositeur ne fait pas Wayland -
  # plus restrictif que --socket=x11 (qui l'autoriserait toujours, même
  # sous Wayland).
  - --socket=fallback-x11
  - --device=dri # accélération GPU, standard pour une appli GTK4

  # --- Réseau ---
  # widgets/weather.py : Open-Meteo (api.open-meteo.com et
  # geocoding-api.open-meteo.com), en clair via urllib, pas d'autre usage
  # réseau dans l'appli.
  - --share=network

  # --- D-Bus session : noms précis uniquement, jamais --socket=session-bus
  # (qui donnerait une visibilité totale sur le bus, bien plus que ce dont
  # l'appli a besoin). org.freedesktop.portal.Desktop (raccourci global,
  # sélecteur de fichiers) n'a pas besoin d'être listé ici : les portails
  # sont joignables par toute appli sandboxée, avec ou sans permission
  # explicite - c'est tout leur principe.
  - --talk-name=org.mpris.MediaPlayer2.* # widgets/audio.py : contrôle de n'importe quel lecteur MPRIS (Plexamp, Spotify, VLC...)
  # widgets/agenda.py, via EDataServer/ECal. Noms de bus versionnés (Sources5,
  # Calendar8) qui changent avec les montées de soname d'evolution-data-
  # server - à revérifier contre la version d'EDS réellement empaquetée
  # (voir aussi le module evolution-data-server plus bas).
  - --talk-name=org.gnome.evolution.dataserver.Sources5
  - --talk-name=org.gnome.evolution.dataserver.Calendar8
  - --talk-name=org.gnome.evolution.dataserver.Subprocess.Backend.* # un backend par source de calendrier connectée, nom choisi dynamiquement par EDS
  - --talk-name=org.gnome.Shell.Extensions # settings_page.py / gnome_extensions.py : détection de l'extension Deja Window (lecture seule, ListExtensions)

  # --- Système de fichiers ---
  # widgets/cpu_temp.py : lecture directe des capteurs hwmon du noyau, il
  # n'existe pas de portail pour ça. Lecture seule, chemin précis (pas /sys
  # en entier, encore moins --filesystem=host).
  - --filesystem=/sys/class/hwmon:ro

  # --- Optionnel : réglage "Lancer sur l'hôte" du widget Raccourcis ---
  # (config.py "shortcuts_host_access", désactivé par défaut, activable
  # depuis les réglages avec une confirmation explicite - voir
  # settings_page.py). Sans les 5 lignes ci-dessous, le réglage existe mais
  # reste sans effet : flatpak-spawn échouerait faute de talk-name, et le
  # sélecteur d'apps de widgets/shortcuts.py ne verrait que les .desktop
  # visibles dans le sandbox (l'appli elle-même, essentiellement rien
  # d'autre). Ce sont exactement les permissions qu'un reviewer Flathub va
  # demander à justifier individuellement (org.freedesktop.Flatpak en
  # particulier équivaut à sortir du sandbox) - à garder seulement après
  # confirmation que cette fonctionnalité optionnelle vaut cette review.
  - --talk-name=org.freedesktop.Flatpak # flatpak-spawn --host, pour les commandes shell et le lancement d'apps hôte
  - --filesystem=/usr/share/applications:ro # lister/lancer les .desktop système
  - --filesystem=/var/lib/flatpak/exports/share/applications:ro # lister/lancer les .desktop des autres Flatpak installés pour tout le monde
  - --filesystem=xdg-data/applications:ro # ~/.local/share/applications
  - --filesystem=xdg-data/flatpak/exports/share/applications:ro # ~/.local/share/flatpak/exports/share/applications (Flatpak --user)

modules:
  # evolution-data-server (+ ses propres dépendances de build : libical-glib,
  # etc.) n'est PAS inclus dans org.gnome.Platform et doit être construit
  # comme un module séparé pour que EDataServer/ECal/ICalGLib soient
  # importables (gi.require_version) à l'intérieur du sandbox - le widget
  # agenda ne fonctionnera pas sans ça. Ne pas réinventer ce module à la
  # main ici (versions/tarballs/sha256 qui périment vite, une erreur casse
  # le build) : partir du module "evolution-data-server" du manifest actuel
  # de org.gnome.Calendar ou org.gnome.Todo sur github.com/flathub, qui le
  # maintient déjà à jour et configuré en désactivant tout ce qui n'est pas
  # nécessaire ici (mail/camel...).
  - name: evolution-data-server
    buildsystem: cmake-ninja
    # À remplacer par le bloc réel (config-opts + sources) copié depuis un
    # manifest Flathub existant qui embarque evolution-data-server.
    config-opts: []
    sources: []

  - name: xeneon-dashboard
    buildsystem: simple
    build-commands:
      - install -d /app/share/xeneon-dashboard
      - cp -r xeneon_dashboard /app/share/xeneon-dashboard/
      - install -Dm755 xeneon-dashboard /app/bin/xeneon-dashboard
    sources:
      # "type: dir" ne sert qu'aux builds locaux de dev avec
      # flatpak-builder. Pour une vraie soumission Flathub, remplacer par
      # "type: git" pointant sur le dépôt public du projet, épinglé sur un
      # tag ou un commit précis (jamais une branche mouvante).
      - type: dir
        path: .
      - type: script
        dest-filename: xeneon-dashboard
        commands:
          - '#!/bin/sh'
          - export PYTHONPATH="/app/share/xeneon-dashboard:$PYTHONPATH"
          - exec python3 -m xeneon_dashboard "$@"
