name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: dnf install -y git rust cargo gtk4-devel libadwaita-devel webkitgtk6.0-devel

      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xeneon-dashboard-rs

      - name: Build
        working-directory: xeneon-dashboard-rs
        run: cargo build --workspace

      - name: Test (xeneon-core)
        working-directory: xeneon-dashboard-rs
        run: cargo test -p xeneon-core
