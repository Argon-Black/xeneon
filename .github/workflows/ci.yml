name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: xeneon-dashboard-rs

      - name: Build
        working-directory: xeneon-dashboard-rs
        run: cargo build --workspace

      - name: Test (xeneon-core)
        working-directory: xeneon-dashboard-rs
        run: cargo test -p xeneon-core
