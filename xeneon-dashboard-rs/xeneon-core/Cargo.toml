[package]
name = "xeneon-core"
version = "0.1.1"
edition = "2024"

[dependencies]
chrono-tz = "0.10.4"
flate2 = "1.1.10"
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
