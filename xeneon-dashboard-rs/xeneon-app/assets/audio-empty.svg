<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Arrière-plan sombre style GTK / Dark Mode -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#161823"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </radialGradient>

    <!-- Dégradé Neon Cyan / Violet -->
    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#e100ff"/>
    </linearGradient>

    <!-- Ombre et lueur interne -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond carré strict (bords droits) -->
  <rect width="256" height="256" fill="url(#bgGlow)"/>
  <rect width="254" height="254" x="1" y="1" fill="none" stroke="#252836" stroke-width="2"/>

  <!-- Graphisme central -->
  <g filter="url(#glow)">

    <!-- Disque vinyle / Platine en filigrane (état inactif) -->
    <circle cx="128" cy="115" r="54" fill="#0d0e15" stroke="#232638" stroke-width="3"/>
    <circle cx="128" cy="115" r="40" fill="none" stroke="#1c1e2b" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="128" cy="115" r="16" fill="#141622" stroke="url(#neonGrad)" stroke-width="3"/>

    <!-- Note de musique centrale (MPRIS vide) -->
    <path d="M 124,95
             V 122
             C 124,126 119,130 112,130
             C 105,130 100,126 100,122
             C 100,118 105,114 112,114
             C 116,114 120,116 122,118
             "
          fill="none"
          stroke="#ffffff"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Tige supérieure note -->
    <path d="M 124,97 L 138,92 V 114" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Icône / Symbole de recherche ou d'attente lecteur -->
    <g opacity="0.4" transform="translate(0, 10)">
      <!-- Ligne de temps / Progress bar inactive -->
      <line x1="48" y1="180" x2="208" y2="180" stroke="#2b2e42" stroke-width="6" stroke-linecap="round"/>

      <!-- Contrôles média fantômes -->
      <path d="M 72,205 L 60,197 V 213 Z" fill="#3a3d58"/>
      <polygon points="120,197 134,205 120,213" fill="#3a3d58"/>
      <path d="M 184,205 L 196,197 V 213 Z" fill="#3a3d58"/>
    </g>

    <!-- Vague de signal coupée / No Player -->
    <path d="M 80,175 Q 128,170 176,175" fill="none" stroke="url(#neonGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="4 4"/>

  </g>
</svg>
