<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Fond du lecteur vidéo -->
  <rect x="10" y="20" width="80" height="60" rx="8" fill="#1e1e2e" stroke="#45475a" stroke-width="3"/>

  <!-- Triangle Play central -->
